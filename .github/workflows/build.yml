name: Firmware

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firmware-manual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build baselines
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.21'
          enable-cache: false
      - name: Install locked SDK environment
        run: ./scripts/Install-Sdk.ps1
      - name: Build Hello
        run: ./scripts/Build.ps1 -Example hello -Jobs 4
      - name: Build BLE peripheral
        run: ./scripts/Build.ps1 -Example ble -Jobs 4
      - name: Build Bringup
        run: ./scripts/Build.ps1 -Example bringup -Jobs 4
      - name: Build generated XML UI demo
        run: ./scripts/Build.ps1 -Example ui_demo -Jobs 4
      - name: Build USB product firmware
        run: ./scripts/Build.ps1 -Example product -Jobs 4
      - name: Build and test PC UI simulator
        run: |
          cmake -S tests -B artifacts/host-ui -G "Visual Studio 17 2022" -A x64 -DWRISTFLOW_BUILD_SIMULATOR=ON
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build artifacts/host-ui --config Debug --parallel 4
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir artifacts/host-ui -C Debug --output-on-failure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
