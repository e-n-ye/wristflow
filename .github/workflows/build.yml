name: Firmware

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firmware-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  change-scope:
    name: Change scope
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Classify changes and check Markdown encoding
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: python3 scripts/check_documentation.py
      - name: Test CI routing
        if: steps.scope.outputs.docs_only == 'false'
        run: python3 -m unittest discover -s tests -p test_ci_scope.py

  firmware:
    name: Firmware and host tests
    needs: change-scope
    if: needs.change-scope.outputs.docs_only == 'false'
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.21'
          enable-cache: false
      - name: Install locked SDK environment
        run: ./scripts/Install-Sdk.ps1
      - name: Build Hello
        run: ./scripts/Build.ps1 -Example hello -Jobs 4
      - name: Build BLE peripheral
        run: ./scripts/Build.ps1 -Example ble -Jobs 4
      - name: Build Bringup
        run: ./scripts/Build.ps1 -Example bringup -Jobs 4
      - name: Build generated XML UI demo
        run: ./scripts/Build.ps1 -Example ui_demo -Jobs 4
      - name: Build and test PC UI simulator
        run: |
          cmake -S tests -B artifacts/host-ui -G "Visual Studio 17 2022" -A x64 -DWRISTFLOW_BUILD_SIMULATOR=ON
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build artifacts/host-ui --config Debug --parallel 4
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir artifacts/host-ui -C Debug --output-on-failure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  build:
    name: Build baselines
    if: always()
    needs: [change-scope, firmware]
    runs-on: ubuntu-latest
    steps:
      - name: Verify required results
        env:
          SCOPE_RESULT: ${{ needs.change-scope.result }}
          DOCS_ONLY: ${{ needs.change-scope.outputs.docs_only }}
          FIRMWARE_RESULT: ${{ needs.firmware.result }}
        run: |
          test "$SCOPE_RESULT" = success
          if [ "$DOCS_ONLY" = true ]; then
            test "$FIRMWARE_RESULT" = skipped
            echo "Documentation only; no firmware or host tests required."
          else
            test "$FIRMWARE_RESULT" = success
          fi
