<text x="65" y="1091" fill="#9c532a" font-family="Microsoft YaHei, sans-serif" font-size="23">后两项仍须加托架厚度、装配与电池余量、后盖；均不是成品厚度。</text>
<text x="65" y="1138" fill="#9c532a" font-family="Microsoft YaHei, sans-serif" font-size="23">厂家图注明带封装尺寸可能更大；34 × 21 × 10 不等于完整安装空间。</text>
<text x="48" y="1213" fill="#596c87" font-family="Microsoft YaHei, sans-serif" font-size="21">本图是位置与风险草图；未更改社区模型，未建立装配配准或碰撞模型，未批准打印／佩戴。</text>
