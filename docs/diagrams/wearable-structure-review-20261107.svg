<text x="452" y="485" fill="#26354a" font-family="Microsoft YaHei, sans-serif" font-size="20">按键侧</text>
<text x="590" y="316" fill="#5079ac" font-family="Microsoft YaHei, sans-serif" font-size="20">蓝：壳盖定位</text>
