<text x="60" y="745" fill="#9c532a" font-family="Microsoft YaHei, sans-serif" font-size="21">模型顶面不是已核PCB / 玻璃安装基准</text>
<text x="860" y="187" fill="#26354a" font-family="Microsoft YaHei, sans-serif" font-size="27">② 先验证后部附件舱：电机独立错层</text>
<text x="860" y="224" fill="#596c87" font-family="Microsoft YaHei, sans-serif" font-size="21">器件占位示意；未与孔柱 / 天线 / PCB配准</text>
