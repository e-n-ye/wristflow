<text x="1034" y="570" fill="#26354a" font-family="Microsoft YaHei, sans-serif" font-size="19">电机</text>
<line x1="1093" y1="568" x2="1210" y2="550" stroke="#9e7ab9" stroke-width="3"/>
<line x1="1210" y1="550" x2="1200.1139584380107" y2="556.8019248918687" stroke="#9e7ab9" stroke-width="3"/>
<line x1="1210" y1="550" x2="1198.5266072132638" y2="546.4841419310121" stroke="#9e7ab9" stroke-width="3"/>
<text x="1220" y="302" fill="#26354a" font-family="Microsoft YaHei, sans-serif" font-size="22">前框 / 按键 / USB / 表带界面</text>
<text x="1220" y="343" fill="#26354a" font-family="Microsoft YaHei, sans-serif" font-size="22">先作为保留参考，不整体缩放</text>
<text x="1220" y="406" fill="#26354a" font-family="Microsoft YaHei, sans-serif" font-size="23">电池独立绝缘托盘</text>
<text x="1220" y="446" fill="#26354a" font-family="Microsoft YaHei, sans-serif" font-size="22">力经后盖筋 / 止口传递</text>
<text x="1220" y="508" fill="#26354a" font-family="Microsoft YaHei, sans-serif" font-size="23">电机与喇叭XY可重叠</text>
<text x="1220" y="548" fill="#26354a" font-family="Microsoft YaHei, sans-serif" font-size="22">Z方向分层，分别固定于结构</text>
<text x="1220" y="589" fill="#26354a" font-family="Microsoft YaHei, sans-serif" font-size="22">不压振膜，不靠电池承力</text>
<text x="860" y="680" fill="#26354a" font-family="Microsoft YaHei, sans-serif" font-size="21">该候选零间隙投影：34 × 41.2 mm；实际要加固定 / 走线 / 余量</text>
<text x="860" y="725" fill="#9c532a" font-family="Microsoft YaHei, sans-serif" font-size="21">原四孔柱和现有铜柱仍需加入装配，不能把该矩形当可用内腔</text>
<rect x="35" y="790" width="1730" height="385" rx="12" fill="#ffffff" stroke="#d9e0eb" stroke-width="2"/>
<text x="60" y="837" fill="#26354a" font-family="Microsoft YaHei, sans-serif" font-size="27">③ 两种取舍：比较值不是成品厚度</text>
<text x="60" y="890" fill="#26354a" font-family="Microsoft YaHei, sans-serif" font-size="25">电机与喇叭同层并排</text>
<text x="520" y="889" fill="#26354a" font-family="Microsoft YaHei, sans-serif" font-size="24">该排列零间隙投影约40.2 × 41.2 mm</text>
<text x="1180" y="888" fill="#596c87" font-family="Microsoft YaHei, sans-serif" font-size="23">可能需要后盖局部外扩</text>
<text x="60" y="945" fill="#26354a" font-family="Microsoft YaHei, sans-serif" font-size="25">电机与喇叭独立错层</text>
<text x="520" y="944" fill="#26354a" font-family="Microsoft YaHei, sans-serif" font-size="24">该排列零间隙投影约34 × 41.2 mm</text>
<text x="1180" y="943" fill="#596c87" font-family="Microsoft YaHei, sans-serif" font-size="23">省宽度，但增加局部厚度</text>
<text x="60" y="1007" fill="#26354a" font-family="Microsoft YaHei, sans-serif" font-size="22">统一比较前提：电池下方h_b暂取目测2，喇叭下方h_s暂取全局4.78；所有结构余量暂取0。</text>
<text x="60" y="1054" fill="#26354a" font-family="Microsoft YaHei, sans-serif" font-size="24">同层：11.32 + max(2+10, 4.78+7.1, 4.78+2.7) = 23.32 mm</text>
<text x="60" y="1102" fill="#26354a" font-family="Microsoft YaHei, sans-serif" font-size="24">错层：11.32 + max(2+10, 4.78+7.1+2.7) = 25.90 mm</text>
<text x="60" y="1148" fill="#9c532a" font-family="Microsoft YaHei, sans-serif" font-size="23">两式仅用于取舍；若覆盖铜柱或托架仍架在柱顶，前提改变，必须重算。</text>
<rect x="35" y="1200" width="1730" height="120" rx="12" fill="#edf1f7" stroke="#d9e0eb" stroke-width="2"/>
<text x="60" y="1239" fill="#26354a" font-family="Microsoft YaHei, sans-serif" font-size="24">进入3D软件后的首件事：板屏 / 铜柱包络配准 → 定支承面 → 比较后舱变体 → 碰撞与合盖检查。</text>
<text x="60" y="1283" fill="#596c87" font-family="Microsoft YaHei, sans-serif" font-size="22">中央约2 mm仍是估计；原盖4.70 mm仅是表面高差。未通过适配 / 佩戴 / 充电验收。</text>
<text x="45" y="1356" fill="#596c87" font-family="Microsoft YaHei, sans-serif" font-size="20">原创结构示意图；未嵌入用户照片或第三方模型。详细CAD输入与停止边界见WEARABLE-PREPARATION。</text>
</svg>
